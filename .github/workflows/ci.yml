name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: 'v1.1.0'

      - name: Install pinned tools
        run: rokit install

      - name: Build place
        run: rojo build default.project.json -o /tmp/ArmouredTycoon.rbxlx
      - name: Validate Luau syntax
        run: echo 'Rojo build above is the Luau syntax gate.'

      - name: Check patch whitespace
        run: git diff --check